services:
  backend:
    build:
      context: ./backend
    container_name: quiz-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - DEBUG=1
      - PYTHONUNBUFFERED=1
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
    container_name: quiz-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"